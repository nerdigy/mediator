version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Chicago
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      # This is the DI package's dependency floor. Raising it forces every consumer up to that version.
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - dependencies
      - nuget

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Chicago
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - actions
