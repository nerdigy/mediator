name: Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (for example: 1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  # Required by NuGet trusted publishing, which exchanges the workflow's OIDC token for a short-lived API key.
  id-token: write

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and Publish
    runs-on: ubuntu-latest
    # The required reviewers on this environment approve each release.
    environment: nuget

    env:
      NUGET_SOURCE_URL: https://api.nuget.org/v3/index.json

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🛡️ Verify the release commit is on main"
        # Covers both triggers: a v*.*.* tag can point at any commit, and a manual run can start from any ref.
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not on main. Packages are published only from commits on main."
            exit 1
          fi

      - name: "🔧 Setup .NET"
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: "🏷️ Resolve package version"
        id: version
        shell: bash
        env:
          # Passed as data, never interpolated into the script, so the input cannot inject shell commands.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${VERSION_INPUT}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NuGet version: '$version'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Using package version: $version"

      - name: "📦 Restore dependencies"
        run: dotnet restore Mediator.slnx

      - name: "🏗️ Build solution"
        run: dotnet build Mediator.slnx --no-restore -c Release -p:Version="${PACKAGE_VERSION}"

      - name: "📏 Check formatting"
        run: dotnet format Mediator.slnx --verify-no-changes --no-restore

      - name: "🧪 Run unit tests"
        run: dotnet test test/Nerdigy.Mediator.UnitTests/Nerdigy.Mediator.UnitTests.csproj --no-build -c Release --logger "trx;LogFileName=unit-tests.trx"

      - name: "🔌 Run integration tests"
        run: dotnet test test/Nerdigy.Mediator.IntegrationTests/Nerdigy.Mediator.IntegrationTests.csproj --no-build -c Release --logger "trx;LogFileName=integration-tests.trx"

      - name: "🏗️ Publish with Native AOT"
        # Trim and AOT warnings fail the publish, because TreatWarningsAsErrors is on for every project. The publish
        # rebuilds the referenced packages, so the release version has to match or the pack step below ships that rebuild.
        run: dotnet publish test/Nerdigy.Mediator.AotSmokeTests/Nerdigy.Mediator.AotSmokeTests.csproj -c Release -r linux-x64 -o artifacts/aot -p:Version="${PACKAGE_VERSION}"

      - name: "🚀 Run the native binary"
        run: ./artifacts/aot/Nerdigy.Mediator.AotSmokeTests

      - name: "📦 Pack NuGet packages"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget

          projects=(
            "src/Nerdigy.Mediator.Contracts/Nerdigy.Mediator.Contracts.csproj"
            "src/Nerdigy.Mediator/Nerdigy.Mediator.csproj"
            "src/Nerdigy.Mediator.DependencyInjection/Nerdigy.Mediator.DependencyInjection.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              --no-build \
              -c Release \
              -o artifacts/nuget \
              -p:Version="${PACKAGE_VERSION}"
          done

      - name: "🔐 Log in to NuGet with trusted publishing"
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: "🚀 Publish packages to NuGet"
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "No .nupkg files found in artifacts/nuget."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "${NUGET_SOURCE_URL}" \
              --api-key "${NUGET_API_KEY}" \
              --skip-duplicate
          done

      - name: "🧭 Publish symbols to NuGet"
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          symbols=(artifacts/nuget/*.snupkg)

          if [[ "${#symbols[@]}" -eq 0 ]]; then
            echo "No .snupkg files found in artifacts/nuget."
            exit 1
          fi

          for symbol in "${symbols[@]}"; do
            dotnet nuget push "$symbol" \
              --source "${NUGET_SOURCE_URL}" \
              --api-key "${NUGET_API_KEY}" \
              --skip-duplicate
          done
